name: Release MCP package

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a new release from main. Ignored when tag is set.
        type: choice
        options: [patch, minor, major]
        default: patch
      tag:
        description: Existing mcp-vX.Y.Z tag to verify and publish again. Completes only the missing stages.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-mcp
  cancel-in-progress: false

env:
  PACKAGE: '@m-sanchez/calibration-explorer-mcp'
  SERVER: io.github.m-sanchez/calibration-explorer
  # Node 24.21.0 bundles npm 11.19.0; trusted publishing needs 11.5.1 or later and npm 12 refuses the git-pinned numerics.
  NODE_VERSION: 24.21.0
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Choose the release tag
        id: choice
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$REF" = refs/heads/main ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "Run a version bump from main, or set tag to publish an existing tag." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.choice.outputs.bump == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.choice.outputs.bump == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bump and test from main
        id: bump
        if: steps.choice.outputs.bump == 'true'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm ci
          cd packages/mcp
          npm ci
          npm version "$BUMP" --no-git-tag-version
          node scripts/versions.mjs --write
          npm test
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push the release
        id: push
        if: steps.choice.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "Miguel Sanchez"
          git config user.email "contact@miguelsanchez.co.uk"
          git add -u
          git commit -m "Release calibration-explorer-mcp $VERSION"
          git tag "mcp-v$VERSION"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push --atomic origin HEAD:main "mcp-v$VERSION"
          echo "tag=mcp-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.push.outputs.tag || steps.choice.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^mcp-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi
          if [ -z "$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG")" ]; then
            echo "Tag $TAG does not exist." >&2
            exit 1
          fi
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$TAG" --jq .status)
          if [ "$STATUS" != identical ] && [ "$STATUS" != behind ]; then
            echo "Tag $TAG points at a commit that is not on main ($STATUS)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm ci
        working-directory: packages/mcp

      - name: Check the tag commit's version and pins
        id: version
        working-directory: packages/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "mcp-v$VERSION" != "$TAG" ]; then
            echo "packages/mcp/package.json is $VERSION at $TAG." >&2
            exit 1
          fi
          node scripts/versions.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack the tag commit
        if: steps.version.outputs.published == 'false'
        working-directory: packages/mcp
        run: npm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Download the already published tarball
        if: steps.version.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pack "$PACKAGE@$VERSION" --pack-destination "$RUNNER_TEMP/package"

      - name: Run the clean-install acceptance suite on that tarball
        working-directory: packages/mcp
        run: |
          MCP_PACKAGE_TARBALL=$(ls "$RUNNER_TEMP"/package/m-sanchez-calibration-explorer-mcp-*.tgz)
          export MCP_PACKAGE_TARBALL
          npm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.published == 'false'
        with:
          name: package
          path: ${{ runner.temp }}/package/m-sanchez-calibration-explorer-mcp-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, verify]
    if: needs.verify.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Publish the tested tarball with trusted publishing
        run: npm publish "$RUNNER_TEMP"/package/m-sanchez-calibration-explorer-mcp-*.tgz --access public
      - name: Wait until npm serves the version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" = "$VERSION" ] && exit 0
            sleep 10
          done
          echo "$PACKAGE@$VERSION is not visible on npm." >&2
          exit 1

  registry:
    needs: [prepare, verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Check server.json against the tag
        id: version
        run: |
          VERSION=$(node -p "require('./packages/mcp/server.json').version")
          if [ "mcp-v$VERSION" != "$TAG" ]; then
            echo "packages/mcp/server.json is $VERSION at $TAG." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER/\//%2F}/versions/$VERSION")
          case "$STATUS" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "MCP Registry lookup returned HTTP $STATUS." >&2; exit 1 ;;
          esac
      - name: Install the pinned mcp-publisher
        if: steps.version.outputs.published == 'false'
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Publish server.json to the MCP Registry
        if: steps.version.outputs.published == 'false'
        run: |
          ./mcp-publisher validate packages/mcp/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish packages/mcp/server.json
